<svg width="180" height="180" viewBox="0 0 180 180" fill="none" xmlns="http://www.w3.org/2000/svg">
  <defs>
    <linearGradient id="bgGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#6366F1"/>
      <stop offset="50%" style="stop-color:#8B5CF6"/>
      <stop offset="100%" style="stop-color:#A855F7"/>
    </linearGradient>
    <linearGradient id="cardGradient" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" style="stop-color:#FFFFFF"/>
      <stop offset="100%" style="stop-color:#F3F4F6"/>
    </linearGradient>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="8" flood-opacity="0.25"/>
    </filter>
    <filter id="innerShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="2" stdDeviation="4" flood-opacity="0.15"/>
    </filter>
  </defs>

  <!-- Background -->
  <rect width="180" height="180" rx="40" fill="url(#bgGradient)"/>

  <!-- Decorative circles -->
  <circle cx="150" cy="30" r="40" fill="white" opacity="0.1"/>
  <circle cx="30" cy="150" r="30" fill="white" opacity="0.08"/>

  <!-- Main card -->
  <g filter="url(#shadow)">
    <rect x="30" y="35" width="120" height="95" rx="12" fill="url(#cardGradient)"/>
  </g>

  <!-- Card content lines -->
  <rect x="45" y="52" width="50" height="6" rx="3" fill="#E5E7EB"/>
  <rect x="45" y="65" width="70" height="6" rx="3" fill="#D1D5DB"/>
  <rect x="45" y="78" width="40" height="6" rx="3" fill="#E5E7EB"/>

  <!-- Checkboxes -->
  <rect x="45" y="95" width="12" height="12" rx="3" fill="#10B981"/>
  <path d="M48 101L51 104L56 99" stroke="white" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/>
  <rect x="63" y="95" width="12" height="12" rx="3" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>
  <rect x="81" y="95" width="12" height="12" rx="3" fill="#F3F4F6" stroke="#D1D5DB" stroke-width="1"/>

  <!-- Question mark badge -->
  <g filter="url(#innerShadow)">
    <circle cx="130" cy="110" r="28" fill="url(#bgGradient)"/>
  </g>
  <text x="130" y="120" font-family="Arial, sans-serif" font-size="32" font-weight="bold" fill="white" text-anchor="middle">?</text>
</svg>